comments: |
  Base JH179A chassis; four I/O slots, four PSU bays and two fan bays.
  The fixed chassis has no data-plane QSFP+ ports: those are supplied by fitted line cards.
  Do not use the upstream FlexFabric-5930-32QSFPP definition: it models a different fixed-port switch and its JH178A part_number is inconsistent with vendor identification.
  Inventory installed I/O cards, PSUs, fan direction and IRF member IDs before populating the bays.
  The USB Type-A host port is not a console. The RJ45 and mini-USB connectors are alternate serial console access paths.
  JH188A is the separately identified TAA ordering variant; preserve that SKU if found.

