comments: |
  48 gigabit copper PoE+ ports and two 1/10GbE SFP+ uplinks (49-50).
  The RJ45 and micro-B connectors are alternate paths to the same serial console; do not use both concurrently.
  The internal PSU and fans are fixed; there are no expansion/PSU module bays.
  The switch has a 370W PoE output budget. This is not the AC input consumption, so it is not written as maximum_draw.

  Sources:
  - [HPE 2530 QuickSpecs](https://www.hpe.com/psnow/downloadDoc/HPE%20Aruba%20Networking%202530%20Switch%20Series-c04111414.pdf?deepLink=&form=false&hf=regular&id=c04111414.pdf&isFutureVersion=true&originalObjectName=&prelaunchSection=&preview=false&print=&r=&section=&softrollSection=&ver=10)
