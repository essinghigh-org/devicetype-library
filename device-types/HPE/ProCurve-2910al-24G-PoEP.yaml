comments: |
  The input drops the plus sign from the vendor PoE+ product name.
  Ports 21-24 are shared dual-personality logical ports (RJ45 or SFP); these templates use copper by default.
  When SFP is selected, change that existing interface media type; do not create additional independent 21-24 interfaces.
  A and B are removable two-port uplink bays. Select J9008A, J9149A or a single J9165A kit module after checking inventory.
  RPS and EPS are proprietary external power connectors, represented as other rather than falsely as ordinary terminal blocks.
  USB Type-A auxiliary host is not a console connector.

  Sources:
