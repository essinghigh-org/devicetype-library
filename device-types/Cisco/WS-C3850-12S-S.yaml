comments: |
  The WS-C3850-12S-S ordering suffix denotes IP Base; a running license may subsequently change.
  12 access ports: 12 1G SFP and 0 multigigabit BASE-T. The uplink network module is optional and is represented by a bay,
  not by preinstalled interfaces. Compatible network modules: C3850-NM-4-1G, C3850-NM-2-10G. Default shipping PSU:
  PWR-C1-350WAC; verify actual PSU population. Three FAN-T1 modules and two fixed StackWise-480 data connectors. Weight is
  the vendor shipping configuration, including fans and one PSU, excluding the uplink network module. Bidirectional
  StackPower connectors are not modeled as unilateral power inputs/outputs. No Loopback, VLAN, or other
  configuration-specific interfaces are created.

