comments: |
  The WS-C3850-24XU-E ordering suffix denotes IP Services; a running license may subsequently change.
  24 access ports: 0 1G BASE-T and 24 multigigabit BASE-T. The uplink network module is optional and is represented by a
  bay, not by preinstalled interfaces. Compatible network modules: C3850-NM-4-1G, C3850-NM-2-10G, C3850-NM-4-10G,
  C3850-NM-8-10G, C3850-NM-2-40G. Default shipping PSU: PWR-C1-1100WAC; verify actual PSU population. Three FAN-T1 modules
  and two fixed StackWise-480 data connectors. Weight is the vendor shipping configuration, including fans and one PSU,
  excluding the uplink network module. PoE fields express the supported IEEE 802.3at mode; Cisco UPOE supplies up to 60 W
  but is proprietary and must not be declared as IEEE 802.3bt. Bidirectional StackPower connectors are not modeled as
  unilateral power inputs/outputs. No Loopback, VLAN, or other configuration-specific interfaces are created.

  Sources:
  https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-3850-series-switches/datasheet_c78-720918.html
  https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3850/hardware/installation/guide/b_c3850_hig/b_c3850_hig_chapter_01.html
