comments: |
  24 PoE+ access ports: 16 10/100/1000 BASE-T and eight 100M/1G/2.5G/5G/10G multigigabit ports. Optional C9200-NM-4X,
  C9200-NM-2Y or C9200-NM-2Q uplink module. Two PSU bays and two C9200-FAN field-replaceable fan modules. PWR-C5-600WAC
  and PWR-C6-600WAC are documented AC supply options. StackWise-160 uses optional adapters supplied in C9200-STACK-KIT;
  the two adapter bays are modeled without assuming installation. No individual stack-adapter module PID or active license
  is inferred. Interface names follow IOS XE member-1 numbering; verify against interface inventory before updating
  existing instances.

