comments: |
  24 10/100/1000 PoE+ access ports and four fixed 1G SFP uplinks. The final suffix denotes the software tier, not a
  different port layout. Default PSU is PWR-C2-640WAC; installed power supplies must be inventoried separately. Three
  FAN-T1 modules. Two optional C3650-STACK adapters provide StackWise-160 ports; C3650-STACK-KIT contains two adapters and
  a cable. Do not instantiate a kit as one two-port adapter. Weight follows the vendor configuration with fans, stacking
  adapters, one PSU and a blank; actual unpopulated chassis weight differs. The USB Type-A storage port is not a console
  port. No configuration-specific interfaces are included.

  Sources:
