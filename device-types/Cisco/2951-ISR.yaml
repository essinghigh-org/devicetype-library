comments: |
  Cisco 2951 ISR G2 physical chassis; installed modules and exact PSU option
  are not inferred from the reported CISCO2951/K9 hardware identifier.
  Exactly three onboard GigabitEthernet interfaces (Gi0/0-0/2).
  Gi0/0 has RJ-45 AND SFP connectors sharing ONE logical interface;
  an SFP uses the same Gi0/0 interface, not an additional fourth GE port.
  Verify live media-type when reconciling cabling.
  Four single-wide EHWIC slots (0-3) can instead house two double-wide
  EHWICs across adjacent pairs (0+1, 2+3). Two SM positions can house
  two single-wide modules OR one double-wide; these are mutually
  exclusive combinations, not extra simultaneous bays.
  Also has 1 internal ISM, 3 PVDM3 sockets and 2 CompactFlash slots.
  Bays represent *possible* expansion positions, not installed parts.
  Standard AC power consumption 75-320 W configuration dependent;
  AC-POE option can draw up to 750 W. No power-port maximum_draw is set
  because exact installed supply/PID was not provided. Weight is a
  reference for the no-module chassis with standard AC PSU (13.15 kg);
  AC-POE weighs 13.6 kg before modules.
  Two USB Type A storage ports are not console ports.
  Sources:
  https://www.cisco.com/c/en/us/td/docs/routers/access/2900/hardware/installation/guide/Hardware_Installation_Guide/Overview.html
  https://www.cisco.com/c/en/us/td/docs/routers/access/2900/hardware/installation/guide/Hardware_Installation_Guide/Internal_Modules.html
