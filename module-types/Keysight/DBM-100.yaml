comments: 'Two bypass segments per module, four sockets each ordered A/B (network), 1/2 (tool). Upper row is odd-numbered
  segment, lower row the next even-numbered segment. NetBox module substitution cannot calculate global sw1..sw8
  numbering from bay 1..4, so this template uses bay/row/port names. Rename to CLI swN.A/B/1/2 after instantiation
  if required. Copper modules provide eight RJ45 sockets; fiber variants have four fixed-LC network sockets and
  four tool SFP cages. Active fail-to-wire state is dynamic and is not modeled as permanent passive port mappings.


  Sources:

  https://manualzilla.com/doc/6924007/install-guide

